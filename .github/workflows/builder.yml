name: builder
on:
  pull_request:
    branches:
      - master
jobs:
  job:
    name: ${{ matrix.os }}-${{ github.workflow }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: x64-osx

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: cmake / vcpkg setup
        run: |
          cmake -G "Ninja Multi-Config" -B build
      
      - name: Build
        run: |
          cmake --build build